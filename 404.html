<title>Impire — not found</title>
<style>
:root {
  color-scheme: light;
  --font: "Geist Variable", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --paper: #fafaf7;
  --ink: #161b22;
  --ink-2: #444c57;
  --ink-4: #a2aab5;
  --border-field: #c7ccd3;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--font); font-size: 14.5px; line-height: 1.5; color: var(--ink); background: var(--paper); -webkit-font-smoothing: antialiased; }
:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(31, 168, 142, 0.32); border-radius: 4px; }
main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 48px 16px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand .word { font-size: 22px; font-weight: 500; letter-spacing: -0.03em; }
h1 { margin: 0; font-size: 18px; font-weight: 500; }
a { color: var(--ink); font-weight: 500; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; text-decoration-color: var(--border-field); }
a:hover { text-decoration-color: var(--ink); }
</style>
</head>
<body>
<main>
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 160 160" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><polyline points="62,48 44,48 44,112 62,112"/><polyline points="98,48 116,48 116,112 98,112"/></g><circle cx="80" cy="80" r="17" fill="#a2aab5"/></svg>
    <span class="word">impire</span>
  </div>
  <h1>Nothing is here.</h1>
  <a href="/">impire.io</a>
</main>
</body>
</html>
